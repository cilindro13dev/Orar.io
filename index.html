    <section class="bg-coverer none">
      <div class="form-lecture none">
        <h1>Link Editing</h1>

        <input
          type="text"
          name="name"
          id="name"
          placeholder="Name"
          maxlength="22"
        />
        <input type="text" name="link" id="link" placeholder="Link" />

        <div class="flexbox">
          <button id="cancel">Cancel</button>
          <button id="submit">Save</button>
        </div>
      </div>

      <div class="form-bell none">
        <select name="bell" id="bell">
          <option value="" disabled selected hidden>Bell #</option>
          <option value="0">Bell 1</option>
          <option value="1">Bell 2</option>
          <option value="2">Bell 3</option>
          <option value="3">Bell 4</option>
          <option value="4">Bell 5</option>
          <option value="5">Bell 6</option>
          <option value="6">Bell 7</option>
          <option value="7">Bell 8</option>
        </select>

        <div class="input-time" data-min="" data-max="">
          <div class="group">
            <div class="up" data-icon="arrow"></div>
            <input type="number" name="" id="" />
            <div class="down" data-icon="arrow"></div>
          </div>

          <div class="group">
            <div class="up" data-icon="arrow"></div>
            <input type="number" name="" id="" />
            <div class="down" data-icon="arrow"></div>
          </div>

          <p>:</p>

          <div class="group">
            <div class="up" data-icon="arrow"></div>
            <input type="number" name="" id="" />
            <div class="down" data-icon="arrow"></div>
          </div>
